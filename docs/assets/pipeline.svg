<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="The tabtrail pipeline: ingest, events, normalized, items, embeddings, clusters, topics, profile">
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e8ebff}.t{font-size:16px;font-weight:700}.s{font-size:12.5px;fill:#aab2da}.h{font-size:13px;fill:#aab2da}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b93bd"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#0b0e1d"/>
<text x="40" y="42" class="h">SOURCES ON YOUR DISK</text>
<rect x="40" y="56" width="190" height="40" rx="20" fill="#222949"/><text x="135" y="81" text-anchor="middle" font-size="14">Browser History</text><rect x="270" y="56" width="190" height="40" rx="20" fill="#222949"/><text x="365" y="81" text-anchor="middle" font-size="14">Claude Code chats</text><rect x="500" y="56" width="190" height="40" rx="20" fill="#222949"/><text x="595" y="81" text-anchor="middle" font-size="14">Pi chats</text>
<path d="M135 96V132" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/><path d="M365 96V114H165V132" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/><path d="M595 96V122H195V132" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/>
<g><rect x="40" y="136" width="190" height="92" rx="12" fill="#161b33" stroke="#5eead4" stroke-width="2"/><text x="56" y="166" class="t"><tspan fill="#5eead4">1  </tspan>ingest</text><text x="56" y="191" class="s">Copy new rows only.</text><text x="56" y="210" class="s">Redact keys and tokens.</text></g>
<g><rect x="270" y="136" width="190" height="92" rx="12" fill="#161b33" stroke="#5eead4" stroke-width="2"/><text x="286" y="166" class="t"><tspan fill="#5eead4">2  </tspan>events</text><text x="286" y="191" class="s">One row shape.</text><text x="286" y="210" class="s">Drop noise. Add seconds.</text></g>
<g><rect x="500" y="136" width="190" height="92" rx="12" fill="#161b33" stroke="#5eead4" stroke-width="2"/><text x="516" y="166" class="t"><tspan fill="#5eead4">3  </tspan>normalized</text><text x="516" y="191" class="s">One short line per event.</text><text x="516" y="210" class="s">Local LLM for long chats.</text></g>
<g><rect x="730" y="136" width="190" height="92" rx="12" fill="#161b33" stroke="#a78bfa" stroke-width="2"/><text x="746" y="166" class="t"><tspan fill="#a78bfa">4  </tspan>items</text><text x="746" y="191" class="s">Same line = one item.</text><text x="746" y="210" class="s">Add up attention.</text></g>
<path d="M232 182H266" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/><path d="M462 182H496" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/><path d="M692 182H726" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M825 228V278" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/>
<g><rect x="730" y="282" width="190" height="92" rx="12" fill="#161b33" stroke="#a78bfa" stroke-width="2"/><text x="746" y="312" class="t"><tspan fill="#a78bfa">5  </tspan>embeddings</text><text x="746" y="337" class="s">Text to 768 numbers.</text><text x="746" y="356" class="s">Ollama, cached.</text></g>
<g><rect x="500" y="282" width="190" height="92" rx="12" fill="#161b33" stroke="#a78bfa" stroke-width="2"/><text x="516" y="312" class="t"><tspan fill="#a78bfa">6  </tspan>clusters</text><text x="516" y="337" class="s">UMAP to 10 numbers,</text><text x="516" y="356" class="s">then HDBSCAN.</text></g>
<g><rect x="270" y="282" width="190" height="92" rx="12" fill="#161b33" stroke="#fbbf24" stroke-width="2"/><text x="286" y="312" class="t"><tspan fill="#fbbf24">7  </tspan>topics</text><text x="286" y="337" class="s">Label, score, trend,</text><text x="286" y="356" class="s">and topic centre.</text></g>
<g><rect x="40" y="282" width="190" height="92" rx="12" fill="#161b33" stroke="#fbbf24" stroke-width="2"/><text x="56" y="312" class="t"><tspan fill="#fbbf24">8  </tspan>profile_md</text><text x="56" y="337" class="s">profile.md: your top</text><text x="56" y="356" class="s">25 topics as a table.</text></g>
<path d="M268 328H234" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/><path d="M498 328H464" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/><path d="M728 328H694" fill="none" stroke="#8b93bd" stroke-width="2.5" marker-end="url(#a)"/>
<text x="480" y="408" text-anchor="middle" class="h">One DuckDB file holds the raw rows, the caches and the results.</text>
</svg>
